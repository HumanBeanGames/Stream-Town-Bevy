[package]
name = "bevy_tidal"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "A zero-setup native Rust pattern and audio engine for Bevy"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = "0.19.1"
cpal = "0.17.3"
hound = "3.5.1"
bevy_egui = { version = "0.42.0", optional = true }

[features]
default = []
console = ["dep:bevy_egui"]
autotest = []

[[bin]]
name = "bevy_tidal"
path = "src/main.rs"
required-features = ["console"]
