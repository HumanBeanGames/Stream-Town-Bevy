[workspace]
resolver = "3"
members = [
    "crates/stream_town_domain",
    "crates/stream_town_game",
    "crates/stream_town_tools",
    "crates/stream_town_migrate",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/HumanBeanGames/Stream-Town-Bevy"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.100"
accesskit = "0.24.1"
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "parallel", "collider-from-mesh", "bevy_scene", "bevy_picking"] }
bevy = { version = "0.19.1", features = ["tga", "wav"] }
bevy_tidal = {
    git = "https://github.com/HumanBeanGames/bevy-tidal.git",
    rev = "f9decb648f26d9fb7ff797707e06c0370676252a",
}
bevy-inspector-egui = "0.37.0"
bevy_egui = "0.41.1"
bevy_hanabi = { version = "0.19.0", default-features = false, features = ["2d", "3d"] }
clap = { version = "4.5.54", features = ["derive"] }
flate2 = "1.1.5"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
indexmap = { version = "2.12.1", features = ["serde"] }
keyring = "4.1.6"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "system-proxy"] }
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sha2 = "0.10.9"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
twitch-irc = { version = "6.1.1", default-features = false, features = ["transport-tcp-rustls-native-roots"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
