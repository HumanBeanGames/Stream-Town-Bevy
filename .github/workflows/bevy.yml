name: Bevy

on:
  push:
    branches: [main, codex/bevy-migration]
    paths: ["bevy-port/**", ".github/workflows/bevy.yml"]
  pull_request:
    paths: ["bevy-port/**", ".github/workflows/bevy.yml"]

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bevy-port
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-x64-windows-e0b785fa-${{ hashFiles('bevy-port/vcpkg.json') }}
      - name: Install shared LGPL FFmpeg runtime
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $binaryCache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Path $binaryCache -Force | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $binaryCache
          git -C $root fetch origin e0b785fa42e9b3ee27f62e54f65e41358a1d2671 --depth 1
          git -C $root checkout --detach e0b785fa42e9b3ee27f62e54f65e41358a1d2671
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          & "$root\vcpkg.exe" install --triplet x64-windows --x-install-root="$root\installed"
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLED_ROOT=$root\installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bevy-port
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p xtask -- validate
      - run: cargo run -p xtask -- stress --agents 300

  package-windows:
    runs-on: windows-latest
    needs: validate
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: bevy-port
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-x64-windows-e0b785fa-${{ hashFiles('bevy-port/vcpkg.json') }}
      - name: Install shared LGPL FFmpeg runtime
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $binaryCache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Path $binaryCache -Force | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $binaryCache
          git -C $root fetch origin e0b785fa42e9b3ee27f62e54f65e41358a1d2671 --depth 1
          git -C $root checkout --detach e0b785fa42e9b3ee27f62e54f65e41358a1d2671
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          & "$root\vcpkg.exe" install --triplet x64-windows --x-install-root="$root\installed"
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLED_ROOT=$root\installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Fetch corresponding native-library sources
        shell: pwsh
        run: |
          $downloads = Join-Path $env:VCPKG_ROOT "downloads"
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null
          function Ensure-SourceArchive($name, $url, $sha512) {
            $path = Join-Path $downloads $name
            if (-not (Test-Path -LiteralPath $path)) {
              $partial = "$path.partial"
              Invoke-WebRequest -Uri $url -OutFile $partial
              $partialHash = (Get-FileHash -LiteralPath $partial -Algorithm SHA512).Hash.ToLowerInvariant()
              if ($partialHash -ne $sha512) {
                throw "Downloaded source archive $name has SHA-512 $partialHash, expected $sha512"
              }
              Move-Item -LiteralPath $partial -Destination $path
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA512).Hash.ToLowerInvariant()
            if ($actual -ne $sha512) {
              throw "Source archive $name has SHA-512 $actual, expected $sha512"
            }
          }
          Ensure-SourceArchive `
            "ffmpeg-ffmpeg-n8.1.1.tar.gz" `
            "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n8.1.1.tar.gz" `
            "e858e92e5eb08d562302cde371af55917df6e1fe53994e18462a3c929a40ede1828c2bd53c2a7d65a2cfd791782ead3cd94efb2def904f49cb5dd8ab5cd4256f"
          Ensure-SourceArchive `
            "cisco-openh264-v2.6.0.tar.gz" `
            "https://github.com/cisco/openh264/archive/refs/tags/v2.6.0.tar.gz" `
            "26a03acde7153a6b40b99f00641772433a244c72a3cc4bca6d903cf3b770174d028369a2fb73b2f0774e1124db0e269758eed6d88975347a815e0366c820d247"
          Ensure-SourceArchive `
            "AMF-headers-v1.5.2.tar.gz" `
            "https://github.com/GPUOpen-LibrariesAndSDKs/AMF/releases/download/v1.5.2/AMF-headers-v1.5.2.tar.gz" `
            "b992d4a1f59f7b1c789d03e7bd9876417a569fb239bfe2e2178f2434ae18653bbacc912de2b8a5f8ff0a85fad28b0c1091c2a8d3417407a37c22c1e907e4c159"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bevy-port
      - run: cargo run -p xtask -- package-windows --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: stream-town-windows-x86_64
          path: bevy-port/dist/stream-town-windows-x86_64.zip
          if-no-files-found: error
