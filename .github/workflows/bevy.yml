name: Bevy

on:
  push:
    branches: [main, codex/bevy-migration]
    paths: ["bevy-port/**", ".github/workflows/bevy.yml"]
  pull_request:
    paths: ["bevy-port/**", ".github/workflows/bevy.yml"]

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bevy-port
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-x64-windows-e0b785fa-${{ hashFiles('bevy-port/vcpkg.json') }}
      - name: Install shared LGPL FFmpeg runtime
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $binaryCache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Path $binaryCache -Force | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $binaryCache
          git -C $root fetch origin e0b785fa42e9b3ee27f62e54f65e41358a1d2671 --depth 1
          git -C $root checkout --detach e0b785fa42e9b3ee27f62e54f65e41358a1d2671
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          & "$root\vcpkg.exe" install --triplet x64-windows --x-install-root="$root\installed"
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLED_ROOT=$root\installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bevy-port
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p xtask -- validate
      - run: cargo run -p xtask -- stress --agents 300

  package-windows:
    runs-on: windows-latest
    needs: validate
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: bevy-port
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-x64-windows-e0b785fa-${{ hashFiles('bevy-port/vcpkg.json') }}
      - name: Install shared LGPL FFmpeg runtime
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $binaryCache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Path $binaryCache -Force | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $binaryCache
          git -C $root fetch origin e0b785fa42e9b3ee27f62e54f65e41358a1d2671 --depth 1
          git -C $root checkout --detach e0b785fa42e9b3ee27f62e54f65e41358a1d2671
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          & "$root\vcpkg.exe" install --triplet x64-windows --x-install-root="$root\installed"
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLED_ROOT=$root\installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bevy-port
      - run: cargo run -p xtask -- package-windows --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: stream-town-windows-x86_64
          path: bevy-port/dist/stream-town-windows-x86_64.zip
          if-no-files-found: error
